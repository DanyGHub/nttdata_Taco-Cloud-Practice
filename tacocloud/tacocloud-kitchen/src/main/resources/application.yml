server:
  port: 8081

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tacocloud_kitchen}
      auto-index-creation: true

tacocloud:
  messaging:
    consumer:
      retry:
        max-attempts: ${TACOCLOUD_CONSUMER_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${TACOCLOUD_CONSUMER_RETRY_INITIAL_INTERVAL:1000}
        multiplier: ${TACOCLOUD_CONSUMER_RETRY_MULTIPLIER:2.0}
        max-interval: ${TACOCLOUD_CONSUMER_RETRY_MAX_INTERVAL:10000}
    rabbit:
      queue: ${TACOCLOUD_RABBIT_QUEUE:tacocloud.order.queue}
      exchange: ${TACOCLOUD_RABBIT_EXCHANGE:tacocloud.order.exchange}
      dlq: ${TACOCLOUD_RABBIT_DLQ:tacocloud.order.queue.dlq}
      dlx: ${TACOCLOUD_RABBIT_DLX:tacocloud.order.dlx}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: rabbitmq-template, rabbitmq-listener
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

---
spring:
  config:
    activate:
      on-profile: jms-template, jms-listener
  jms:
    template:
      receive-timeout: 2
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USER:tacoweb}
    password: ${ARTEMIS_PASSWORD:}
    embedded:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: kafka-listener
  kafka:
    bootstrap-servers:
    - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: tacocloud_kitchen
      properties:
        spring.json.trusted.packages: tacos