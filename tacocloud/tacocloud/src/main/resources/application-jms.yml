# Taco Cloud - Profile: jms
tacocloud:
  messaging:
    transport: jms
    jms:
      destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}

spring:
  jms:
    template:
      default-destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USER:tacoweb}
    password: ${ARTEMIS_PASSWORD:}
    embedded:
      enabled: false

management:
  health:
    jms:
      enabled: true
    rabbit:
      enabled: false
    kafka:
      enabled: false
