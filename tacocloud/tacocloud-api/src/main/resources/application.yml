taco:
  discount:
    codes:
      abcdef: 10
    coupons:
      TACO10:
        type: PERCENTAGE
        value: 10
        min-order-amount: 10.00
        max-discount-amount: 5.00
        valid-from: "2026-01-01T00:00:00Z"
        valid-to: "2026-12-31T23:59:59Z"
      SAVE5:
        type: FIXED
        value: 5.00
        min-order-amount: 15.00
        valid-from: "2026-01-01T00:00:00Z"
        valid-to: "2026-12-31T23:59:59Z"
      MEGA50:
        type: PERCENTAGE
        value: 50
        min-order-amount: 20.00
        max-discount-amount: 10.00
        valid-from: "2026-01-01T00:00:00Z"
        valid-to: "2026-12-31T23:59:59Z"
      EXPIRED2020:
        type: PERCENTAGE
        value: 20
        valid-from: "2020-01-01T00:00:00Z"
        valid-to: "2020-12-31T23:59:59Z"
      FUTURE2030:
        type: FIXED
        value: 10.00
        valid-from: "2030-01-01T00:00:00Z"
        valid-to: "2030-12-31T23:59:59Z"

tacocloud:
  messaging:
    transport: noop
    jms:
      destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
    rabbit:
      queue: ${TACOCLOUD_RABBIT_QUEUE:tacocloud.order.queue}
      exchange: ${TACOCLOUD_RABBIT_EXCHANGE:}
      routing-key: ${TACOCLOUD_RABBIT_ROUTING_KEY:tacocloud.order.queue}
    kafka:
      topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
  outbox:
    enabled: true
    batch-size: 10
    lock-duration-ms: 30000
    max-retries: 5
    backoff-multiplier-ms: 2000
    scheduler:
      fixed-delay-ms: 2000
  mongo:
    transactions:
      enabled: false

spring:
  jms:
    template:
      default-destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USER:tacoweb}
    password: ${ARTEMIS_PASSWORD:}
    embedded:
      enabled: false
      
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  kafka:
    bootstrap-servers:
    - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer    

management:
  health:
    rabbit:
      enabled: false
    jms:
      enabled: false
    kafka:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: production, prod
    
  artemis:
    host: ${ARTEMIS_HOST:artemis.tacocloud.com}
    port: ${ARTEMIS_PORT:61617}
    user: ${ARTEMIS_USER:tacoweb}
    password: ${ARTEMIS_PASSWORD:}